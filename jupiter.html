<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0f14">
<title>Exercise Jupiter — MediaSim</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div id="ex-banner">⚠ Exercise Only — Exercise Jupiter — Simulated content, not real ⚠</div>

<div id="device">
  <div class="statusbar">
    <span id="sb-time">13:00</span>
    <span class="sb-r">▮▮▮ &nbsp;WiFi&nbsp; 🔋</span>
  </div>

  <div id="screen">
    <!-- Replaced once the app boots. If this is still visible, something failed. -->
    <div id="boot" style="padding:40px 26px;text-align:center;color:#65676b;font-size:14px;line-height:1.5">
      <div style="font-size:28px;margin-bottom:10px">📡</div>
      <b style="color:#050505;display:block;margin-bottom:6px">Loading Exercise Jupiter…</b>
      If this message stays on screen, pull down to refresh.
      <div id="boot-err" style="display:none;margin-top:16px;padding:12px;background:#fdecea;
        border-radius:8px;color:#8b1a1a;font-size:12px;text-align:left;word-break:break-word"></div>
    </div>
  </div>
  <noscript>
    <div style="padding:40px 26px;text-align:center;font-size:14px">
      This exercise tool needs JavaScript enabled.
    </div>
  </noscript>

  <button id="fab" title="Post as The Kirkwood">✎</button>

  <div id="sheet">
    <div class="sh-head">
      <button id="sh-cancel">Cancel</button>
      <button id="sh-post" class="sh-post" disabled>Post</button>
    </div>
    <div class="sh-as">Posting as <b>The Kirkwood</b> · <span id="sh-plat">Facebook</span></div>
    <div id="sh-ctx"></div>
    <textarea id="sh-text" placeholder="Write an update…"></textarea>
  </div>

  <div id="nav"></div>
  <div id="rail"></div>
</div>

<!-- Facilitator preview bar. Hidden unless the URL carries ?f=1 -->
<div id="prev">
  <span class="clk">T+000 13:00</span>
  <span class="ph"></span>
  <button data-play>❚❚</button>
  <button data-speed="1" class="on">1×</button>
  <button data-speed="10">10×</button>
  <button data-speed="30">30×</button>
  <button data-speed="90">90×</button>
  <select data-jump style="background:#1f2933;color:#e6edf3;border:1px solid #313d49;border-radius:5px;padding:3px 6px;font-size:11px;">
    <option value="">jump to…</option>
    <option value="0">P1 Alarm (T+0)</option>
    <option value="20">P2 Movement (T+20)</option>
    <option value="45">P3 Clearing station (T+45)</option>
    <option value="65">P4 Media peak (T+65)</option>
    <option value="100">P5 Recovery (T+100)</option>
  </select>
  <span class="nxt"></span>
  <span class="ind"></span>
  <button data-wm title="Toggle EXERCISE watermark on every post">WM</button>
  <button data-reset>reset</button>
</div>

<!-- Surface failures on screen. A participant on the day cannot open a console,
     and a silent blank page is indistinguishable from a dead exercise. -->
<script>
(function(){
  function show(msg){
    var b = document.getElementById('boot-err');
    if (!b) return;
    b.style.display = 'block';
    b.textContent = String(msg).slice(0, 400);
  }
  window.addEventListener('error', function(e){
    show((e.message || 'Load error') + (e.filename ? ' — ' + e.filename.split('/').pop() : ''));
  }, true);
  window.addEventListener('unhandledrejection', function(e){ show(e.reason); });
  // If nothing has rendered after 8 seconds, say so rather than sitting blank.
  setTimeout(function(){
    if (document.getElementById('boot')) show('The app did not start. Close this tab completely and reopen the link.');
  }, 8000);
})();
</script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
